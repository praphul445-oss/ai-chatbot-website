<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My AI Chatbot</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <div class="chat-container">


        <!-- =================================================
             HEADER
             ================================================= -->

        <div class="chat-header">

            🤖 My AI Chatbot

        </div>


        <!-- =================================================
             RAG / PDF AREA
             ================================================= -->

        <div class="upload-area">

            <input
                type="file"
                id="pdfInput"
                accept=".pdf,application/pdf"
            >

            <button
                onclick="uploadPDF()"
            >
                📄 Upload PDF
            </button>

            <div id="uploadStatus"></div>

        </div>


        <!-- =================================================
             CHAT AREA
             ================================================= -->

        <div
            class="chatbox"
            id="chatbox"
        >

            <div
                class="message ai-message"
            >
                👋 Hello! I am your AI assistant.
                How can I help you?
            </div>

        </div>


        <!-- =================================================
             INPUT AREA
             ================================================= -->

        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Ask me anything..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>


    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="script.js"></script>

</body>

</html>
